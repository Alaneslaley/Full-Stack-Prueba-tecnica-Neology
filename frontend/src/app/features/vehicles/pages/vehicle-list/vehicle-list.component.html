<section class="vehicle-list-page">

  <div class="page-header">
    <div>
      <h1>Vehículos</h1>
      <p>Consulta y administra los vehículos registrados.</p>
    </div>

    <button
      mat-flat-button
      color="primary"
      routerLink="/operaciones">
      <mat-icon>add</mat-icon>
      Nueva operación
    </button>
  </div>

  <mat-card>

    <mat-card-content>

      <div class="filters">

        <mat-form-field appearance="outline">
          <mat-label>Buscar por placa</mat-label>

          <mat-icon matPrefix>
            search
          </mat-icon>

          <input
            matInput
            [formControl]="filterControl"
            placeholder="Ej. ABC-123">

        </mat-form-field>

      </div>

      <div class="table-container">

        <table
          mat-table
          [dataSource]="dataSource"
          matSort>

          <!-- Placa -->
          <ng-container matColumnDef="plate">

            <th
              mat-header-cell
              *matHeaderCellDef
              mat-sort-header>
              Placa
            </th>

            <td
              mat-cell
              *matCellDef="let vehicle">
              <strong>
                {{ vehicle.plate }}
              </strong>
            </td>

          </ng-container>

          <!-- Tipo -->
          <ng-container matColumnDef="type">

            <th
              mat-header-cell
              *matHeaderCellDef
              mat-sort-header>
              Tipo
            </th>

            <td
              mat-cell
              *matCellDef="let vehicle">

              <span
                class="vehicle-type"
                [class.official]="vehicle.type === 'OFFICIAL'"
                [class.resident]="vehicle.type === 'RESIDENT'"
                [class.non-resident]="vehicle.type === 'NON_RESIDENT'">

                {{ getVehicleTypeLabel(vehicle.type) }}

              </span>

            </td>

          </ng-container>

          <!-- Acciones -->
          <ng-container matColumnDef="actions">

            <th
              mat-header-cell
              *matHeaderCellDef>
              Acciones
            </th>

            <td
              mat-cell
              *matCellDef="let vehicle"
              class="actions-cell">

              <button
                mat-icon-button
                matTooltip="Registrar entrada"
                (click)="registerEntry(vehicle)">

                <mat-icon>
                  login
                </mat-icon>

              </button>

              <button
                mat-icon-button
                matTooltip="Registrar salida"
                (click)="registerExit(vehicle)">

                <mat-icon>
                  logout
                </mat-icon>

              </button>

              <button
                mat-icon-button
                matTooltip="Ver detalle"
                (click)="viewDetail(vehicle)">

                <mat-icon>
                  visibility
                </mat-icon>

              </button>

            </td>

          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns">
          </tr>

          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns;">
          </tr>

          <tr
            class="mat-row"
            *matNoDataRow>

            <td
              class="mat-cell no-data"
              [attr.colspan]="displayedColumns.length">

              No se encontraron vehículos.

            </td>

          </tr>

        </table>

      </div>

      <mat-paginator
        [pageSize]="5"
        [pageSizeOptions]="[5, 10, 25]"
        showFirstLastButtons>
      </mat-paginator>

    </mat-card-content>

  </mat-card>

</section>
